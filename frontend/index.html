<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scheme Predictor is an academic research prototype that helps people discover government schemes that may match their socio-economic profile."
    />
    <title>Scheme Predictor — Civic eligibility research portal</title>
    <style>
      html.citizen-boot[data-citizen-theme="dark"] {
        background: #0e141b;
        color: #eef3f8;
      }
      html.citizen-boot[data-citizen-theme="light"] {
        background: #f8f6ef;
        color: #1f2f29;
      }
      html.admin-boot[data-admin-theme="light"] {
        background: #f5f8fc;
        color: #0f1f3d;
      }
      html.admin-boot[data-admin-theme="dark"] {
        background: #0c121b;
        color: #e8eef6;
      }
    </style>
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          var skip = path === "/login" || path === "/register" || path.indexOf("/admin") === 0;
          var stored = localStorage.getItem("schemewise.citizen-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.setAttribute("data-citizen-theme", theme);
          if (!skip) document.documentElement.classList.add("citizen-boot");
          if (path.indexOf("/admin") === 0) {
            var adminStored = localStorage.getItem("schemewise.admin-theme");
            var adminTheme = adminStored === "light" || adminStored === "dark" ? adminStored : "light";
            document.documentElement.setAttribute("data-admin-theme", adminTheme);
            document.documentElement.classList.add("admin-boot");
          }
        } catch (error) {
          document.documentElement.setAttribute("data-citizen-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,560;8..60,650;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
